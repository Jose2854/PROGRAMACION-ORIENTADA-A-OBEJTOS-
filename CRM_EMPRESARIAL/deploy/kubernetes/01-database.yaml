apiVersion: v1
kind: Secret
metadata:
  name: colaereo-database-secret
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: colaereo_crm
  POSTGRES_USER: colaereo
  # Cambiar antes de desplegar en un ambiente real.
  POSTGRES_PASSWORD: UnaClaveSeguraAqui
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: colaereo-postgres-data
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: colaereo-crm
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colaereo-crm
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgresql
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          envFrom:
            - secretRef:
                name: colaereo-database-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: colaereo-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: database
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
