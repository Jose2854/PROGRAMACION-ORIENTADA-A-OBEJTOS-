apiVersion: v1
kind: Secret
metadata:
  name: colaereo-backend-secret
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Debe ser una cadena aleatoria larga de, por lo menos, 32 caracteres.
  JWT_SECRET: una-clave-privada-larga-de-mas-de-32-caracteres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: colaereo-backend-config
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
data:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/colaereo_crm
  SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
  SPRING_JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  SPRING_H2_CONSOLE: "false"
  FLYWAY_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: https://crm.colaereo.com
  JWT_ACCESS_EXPIRATION_MS: "900000"
  JWT_REFRESH_EXPIRATION_MS: "604800000"
  MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
  SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
  JAVA_TOOL_OPTIONS: -Xms512m -Xmx4g
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: colaereo-crm
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colaereo-crm
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-database
          image: postgres:15-alpine
          command:
            - /bin/sh
            - -c
            - until pg_isready -h database -p 5432; do sleep 2; done
      containers:
        - name: backend
          # Reemplazar por la imagen publicada del backend de COLAEREO.
          image: ghcr.io/jose2854/colaereo-crm-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: colaereo-backend-config
            - secretRef:
                name: colaereo-backend-secret
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: colaereo-database-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: colaereo-database-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
