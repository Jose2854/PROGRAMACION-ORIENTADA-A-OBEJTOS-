# CRM COLAEREO - Red Hat OpenShift Developer Sandbox
#
# Archivo recomendado para subir desde la opcion "Import YAML" del Sandbox.
# Usa el proyecto seleccionado (por ejemplo, jose-28-dev), no crea namespaces
# y no necesita permisos de administrador ni operadores adicionales.
#
# Antes de aplicar, reemplazar:
#   1. CAMBIAR_PASSWORD_BASE_DATOS
#   2. CAMBIAR_CLAVE_JWT_MINIMO_32_CARACTERES
#   3. https://crm.colaereo.com si se utilizara otro dominio
#
# Aplicar con:
#   oc project jose-28-dev
#   oc apply -f colaereo-redhat-sandbox.yaml

apiVersion: v1
kind: Secret
metadata:
  name: colaereo-database-secret
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: colaereo_crm
  POSTGRES_USER: colaereo
  POSTGRES_PASSWORD: CAMBIAR_PASSWORD_BASE_DATOS
---
apiVersion: v1
kind: Secret
metadata:
  name: colaereo-backend-secret
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  JWT_SECRET: CAMBIAR_CLAVE_JWT_MINIMO_32_CARACTERES
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: colaereo-backend-config
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
data:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/colaereo_crm
  SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
  SPRING_JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  SPRING_H2_CONSOLE: "false"
  FLYWAY_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: https://crm.colaereo.com
  JWT_ACCESS_EXPIRATION_MS: "900000"
  JWT_REFRESH_EXPIRATION_MS: "604800000"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  JAVA_TOOL_OPTIONS: -Xms256m -Xmx2304m
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: colaereo-postgres-data
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: colaereo-crm
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colaereo-crm
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-15-c9s:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: colaereo-database-secret
                  key: POSTGRES_DB
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: colaereo-database-secret
                  key: POSTGRES_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: colaereo-database-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: colaereo-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: database
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: colaereo-crm
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colaereo-crm
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: colaereo-crm
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colaereo-crm
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-database
          image: quay.io/sclorg/postgresql-15-c9s:latest
          command:
            - /bin/sh
            - -c
            - until pg_isready -h database -p 5432; do sleep 2; done
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - /bin/sh
            - -c
            - until redis-cli -h redis ping; do sleep 2; done
      containers:
        - name: backend
          image: ghcr.io/jose2854/colaereo-crm-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: colaereo-backend-config
            - secretRef:
                name: colaereo-backend-secret
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: colaereo-database-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: colaereo-database-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: colaereo-crm
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colaereo-crm
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/jose2854/colaereo-crm-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: frontend
spec:
  to:
    kind: Service
    name: frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
