# CRM COLAEREO - Despliegue completo para Kubernetes
#
# Antes de aplicar, reemplazar:
#   1. CAMBIAR_PASSWORD_BASE_DATOS
#   2. CAMBIAR_CLAVE_JWT_MINIMO_32_CARACTERES
#   3. https://crm.colaereo.com si se utilizara otro dominio
#
# Aplicar con:
#   kubectl apply -f colaereo-crm-completo.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
---
apiVersion: v1
kind: Secret
metadata:
  name: colaereo-database-secret
  namespace: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: colaereo_crm
  POSTGRES_USER: colaereo
  POSTGRES_PASSWORD: CAMBIAR_PASSWORD_BASE_DATOS
---
apiVersion: v1
kind: Secret
metadata:
  name: colaereo-backend-secret
  namespace: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  JWT_SECRET: CAMBIAR_CLAVE_JWT_MINIMO_32_CARACTERES
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: colaereo-backend-config
  namespace: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
data:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/colaereo_crm
  SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
  SPRING_JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  SPRING_H2_CONSOLE: "false"
  FLYWAY_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: https://crm.colaereo.com
  JWT_ACCESS_EXPIRATION_MS: "900000"
  JWT_REFRESH_EXPIRATION_MS: "604800000"
  MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
  SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  JAVA_TOOL_OPTIONS: -Xms512m -Xmx4g
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: colaereo-postgres-data
  namespace: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: colaereo-crm
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colaereo-crm
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgresql
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          envFrom:
            - secretRef:
                name: colaereo-database-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: colaereo-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: colaereo-crm
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colaereo-crm
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-database
          image: postgres:15-alpine
          command:
            - /bin/sh
            - -c
            - until pg_isready -h database -p 5432; do sleep 2; done
      containers:
        - name: backend
          image: ghcr.io/jose2854/colaereo-crm-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: colaereo-backend-config
            - secretRef:
                name: colaereo-backend-secret
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: colaereo-database-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: colaereo-database-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: colaereo-crm
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: colaereo-crm
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/jose2854/colaereo-crm-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: colaereo-crm
  labels:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: frontend
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: colaereo-crm
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
