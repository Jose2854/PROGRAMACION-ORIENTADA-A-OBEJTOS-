# ============================================
# Configuracion Desarrollo (H2 persistente)
# ============================================

# Database - H2
spring.datasource.url=jdbc:h2:file:./data/crm_saas_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway - deshabilitado en dev (usa ddl-auto)
spring.flyway.enabled=false

# JWT
app.jwt.secret=crm-saas-dev-secret-key-min-256-bits-for-hs256-signing-alg
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Cuenta inicial de desarrollo (sobrescribible por variables de entorno)
app.dev.superadmin.username=${DEV_SUPERADMIN_USERNAME:superadmin}
app.dev.superadmin.password=${DEV_SUPERADMIN_PASSWORD:SuperAdmin123!}
app.dev.superadmin.email=${DEV_SUPERADMIN_EMAIL:superadmin@crm-saas.com}

# Redis - deshabilitado en dev
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.health.redis.enabled=false
management.health.mail.enabled=false
spring.data.redis.repositories.enabled=false

# Mail - deshabilitado en dev
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=

# Logging
logging.level.com.crm=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
