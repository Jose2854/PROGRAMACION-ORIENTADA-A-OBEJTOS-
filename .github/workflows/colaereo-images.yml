name: Construir imagenes CRM COLAEREO

on:
  push:
    branches:
      - main
    paths:
      - CRM_EMPRESARIAL/backend/**
      - CRM_EMPRESARIAL/frontend/**
      - .github/workflows/colaereo-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: CRM_EMPRESARIAL/backend
          push: true
          tags: |
            ghcr.io/jose2854/colaereo-crm-backend:latest
            ghcr.io/jose2854/colaereo-crm-backend:${{ github.sha }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: CRM_EMPRESARIAL/frontend
          push: true
          tags: |
            ghcr.io/jose2854/colaereo-crm-frontend:latest
            ghcr.io/jose2854/colaereo-crm-frontend:${{ github.sha }}
